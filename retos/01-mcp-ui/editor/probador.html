<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Probador MCP</title>
    <style>
      :root {
        color-scheme: light;
        --fondo: #fff;
        --superficie: #f5f5f4;
        --linea: #e4e4e2;
        --texto: #171717;
        --suave: #6b6b6b;
        --acento: #e0281d;
        --ok: #15803d;
        font-family: ui-monospace, 'Geist Mono', SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        line-height: 1.55;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 1rem 1.1rem 2rem;
        background: var(--fondo);
        color: var(--texto);
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: 1rem;
      }
      h1 small,
      .suave {
        color: var(--suave);
        font-weight: 400;
      }
      h2 {
        margin: 1.5rem 0 0.6rem;
        font-size: 0.75rem;
        font-weight: 400;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--suave);
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        padding: 0.3rem 0.7rem;
        border: 1px solid var(--linea);
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--texto);
      }
      input,
      select {
        width: 9rem;
        padding: 0.3rem 0.45rem;
        border: 1px solid var(--linea);
        border-radius: 4px;
        background: var(--superficie);
      }
      pre {
        margin: 0.5rem 0 0;
        padding: 0.6rem 0.75rem;
        max-height: 12rem;
        overflow: auto;
        border: 1px solid var(--linea);
        border-radius: 4px;
        background: var(--superficie);
        font-size: 0.75rem;
        white-space: pre-wrap;
      }
      details {
        margin-top: 0.4rem;
      }
      summary {
        cursor: pointer;
        color: var(--suave);
        font-size: 0.78rem;
      }
      .cabecera {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--linea);
      }
      .chat {
        display: grid;
        gap: 0.5rem;
      }
      .burbuja {
        max-width: 85%;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--linea);
        border-radius: 8px;
      }
      .usuario {
        justify-self: end;
        background: var(--superficie);
      }
      .llamada > code {
        color: var(--acento);
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        font-size: 0.75rem;
      }
      .ok {
        color: var(--ok);
      }
      .error {
        color: var(--acento);
      }
      .aviso {
        margin-top: 0.5rem;
        padding: 0.5rem 0.75rem;
        border-left: 2px solid var(--acento);
        background: #fdecea;
        color: #9f1c13;
        font-size: 0.78rem;
      }
      /* La vista de MCP Apps: en un cliente de verdad, un iframe aislado */
      .marco {
        margin-top: 0.5rem;
        border: 1px solid var(--linea);
        border-radius: 8px;
        overflow: hidden;
      }
      .marco p {
        padding: 0.3rem 0.6rem;
        border-bottom: 1px solid var(--linea);
        background: var(--superficie);
        font-size: 0.72rem;
        color: var(--suave);
      }
      iframe.vista {
        display: block;
        width: 100%;
        height: 320px;
        border: 0;
      }
      .eventos {
        margin: 0.4rem 0 0;
        padding: 0;
        list-style: none;
        font-size: 0.72rem;
      }
      .eventos li::before {
        content: '← vista ';
        color: var(--suave);
      }
      .eventos code {
        color: var(--ok);
        margin-right: 0.5rem;
      }
      .herramientas {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .herramientas > li {
        padding-block: 0.75rem;
        border-top: 1px solid var(--linea);
      }
      .herramientas form {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 0.5rem;
        margin-top: 0.4rem;
      }
      label span {
        display: block;
        font-size: 0.7rem;
        color: var(--suave);
      }
      .ui {
        margin-left: 0.5rem;
        padding: 0 0.35rem;
        border: 1px solid #15803d55;
        border-radius: 4px;
        color: var(--ok);
        font-size: 0.7rem;
      }
    </style>
  </head>
  <body>
    <header class="cabecera">
      <h1>Cliente MCP <small>· probador</small></h1>
      <p id="servidor" class="suave">conectando…</p>
    </header>

    <h2>En el chat</h2>
    <div id="chat" class="chat"></div>

    <h2>Herramientas del servidor</h2>
    <ul id="herramientas" class="herramientas"></ul>

    <script type="module" src="./probador.js"></script>
  </body>
</html>
