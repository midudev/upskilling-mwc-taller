<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>La Tienda · Taller MWC</title>
    <link rel="stylesheet" href="/src/estilos.css" />
  </head>
  <body>
    <header class="cabecera">
      <a class="marca" href="/">la<span>/</span>tienda</a>
      <p id="agente" class="agente" hidden></p>
    </header>

    <main>
      <section class="catalogo" aria-label="Catálogo">
        <form id="filtros" class="filtros">
          <label>
            <span>Buscar</span>
            <input type="search" name="texto" placeholder="teclado, mochila…" autocomplete="off" />
          </label>
          <label>
            <span>Categoría</span>
            <select name="categoria">
              <option value="">Todas</option>
            </select>
          </label>
          <label>
            <span>Precio máximo</span>
            <input type="number" name="precioMaximo" min="1" step="1" placeholder="€" />
          </label>
        </form>

        <!-- Bloque 3 · Jev -->
        <form id="inteligente" class="inteligente">
          <label>
            <span>Búsqueda inteligente <small>· Jev</small></span>
            <input
              type="text"
              name="peticion"
              placeholder="un regalo para alguien que teletrabaja, por menos de 60 €"
              autocomplete="off"
              required
            />
          </label>
          <button type="submit">Buscar</button>
        </form>

        <!-- Reto 5 · runonweb: buscar por significado y dictar, en local -->
        <form id="significado" class="inteligente significado">
          <label>
            <span>Buscar por significado <small>· runonweb, en tu navegador</small></span>
            <input type="text" name="peticion" placeholder="algo para no oír a nadie en el tren" autocomplete="off" required />
          </label>
          <div class="botones">
            <button id="dictar" type="button" class="dictar" aria-pressed="false" title="Dictar la búsqueda">
              <span aria-hidden="true">●</span> Dictar
            </button>
            <button type="submit">Buscar</button>
          </div>
        </form>

        <p id="estado" class="estado" role="status"></p>
        <ul id="productos" class="productos"></ul>
      </section>

      <aside class="carrito" aria-label="Carrito">
        <h2>Carrito</h2>
        <ul id="lineas"></ul>
        <p class="total"><span>Total</span><strong id="total">0 €</strong></p>
        <button id="vaciar" type="button">Vaciar carrito</button>

        <!-- Bloque 2 · WebMCP (API declarativa) -->
        <form
          id="ofertas"
          class="ofertas"
          toolname="suscribir_ofertas"
          tooldescription="Suscribe un correo electrónico a los avisos de ofertas de una categoría de la tienda."
        >
          <h2>Ofertas</h2>
          <label>
            <span>Correo electrónico</span>
            <input
              type="email"
              name="email"
              required
              placeholder="tu@correo.com"
              toolparamdescription="Correo electrónico del usuario"
            />
          </label>
          <label>
            <span>Categoría que te interesa</span>
            <select name="categoria" required toolparamdescription="Categoría de productos que le interesa">
              <option>escritorio</option>
              <option>audio</option>
              <option>viaje</option>
              <option>hogar</option>
            </select>
          </label>
          <button type="submit">Avísame</button>
          <p id="ofertas-estado" class="estado" role="status"></p>
        </form>
      </aside>
    </main>

    <dialog id="detalle" class="detalle" closedby="any">
      <form method="dialog"><button class="cerrar" aria-label="Cerrar">×</button></form>
      <div id="detalle-contenido"></div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
